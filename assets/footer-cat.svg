<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .cat-bob{transform-box:view-box;transform-origin:64px 116px;animation:cat-bob 3.6s ease-in-out infinite}
    .tail{transform-box:view-box;transform-origin:82px 103px;animation:tail-swish 2.8s ease-in-out infinite}
    .cat-eyes{transform-box:fill-box;transform-origin:center;animation:cat-blink 5.2s ease-in-out infinite}
    @keyframes cat-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes tail-swish{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
    @keyframes cat-blink{0%,91%,100%{transform:scaleY(1)}94%,96%{transform:scaleY(.12)}}
    @media(prefers-reduced-motion:reduce){.cat-bob,.tail,.cat-eyes{animation:none}}
  </style>
