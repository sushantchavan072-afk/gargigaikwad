<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 112" fill="none">
  <style>
    .walk-body{transform-box:fill-box;transform-origin:center;animation:body-bob .36s steps(2,end) infinite}
    .walk-tail{transform-box:view-box;transform-origin:34px 57px;animation:tail-swish .52s ease-in-out infinite alternate}
    .leg{transform-box:view-box;transform-origin:50% 0;animation:walk-step .36s ease-in-out infinite alternate}
    .leg-b{animation-delay:-.18s}
    .leg-c{animation-delay:-.18s}
    .leg-d{animation-delay:0s}
    @keyframes body-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes tail-swish{0%{transform:rotate(-7deg)}100%{transform:rotate(11deg)}}
    @keyframes walk-step{0%{transform:rotate(-17deg)}100%{transform:rotate(17deg)}}
    @media(prefers-reduced-motion:reduce){.walk-body,.walk-tail,.leg{animation:none}}
  </style>
  <path class="walk-tail" d="M37 57c-19-4-29-16-24-27 4-8 12-9 17-3 3 4 2 8-1 11" stroke="#e7a34f" stroke-width="10" stroke-linecap="round"/>
  <path class="walk-tail" d="M36 56c-14-4-21-14-16-22" stroke="#f8cf84" stroke-width="3" stroke-linecap="round"/>
  <g class="leg leg-a">
    <path d="M49 67 44 88" stroke="#e7a34f" stroke-width="11" stroke-linecap="round"/>
    <path d="M43 88h13" stroke="#f3b65b" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g class="leg leg-b">
    <path d="M65 69 68 88" stroke="#f3b65b" stroke-width="10" stroke-linecap="round"/>
    <path d="M66 88h13" stroke="#e7a34f" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g class="leg leg-c">
    <path d="M94 67 91 88" stroke="#f3b65b" stroke-width="10" stroke-linecap="round"/>
    <path d="M86 88h13" stroke="#e7a34f" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g class="leg leg-d">
    <path d="M108 65 113 88" stroke="#e7a34f" stroke-width="11" stroke-linecap="round"/>
    <path d="M108 88h13" stroke="#f3b65b" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g class="walk-body">
    <ellipse cx="72" cy="61" rx="40" ry="23" fill="#f3b65b"/>
    <path d="M63 44c9 0 19 7 23 20 3 10-2 19-13 19-12 0-19-8-19-19 0-11 3-20 9-20Z" fill="#fff0d4"/>
    <path d="m98 28-1-17c0-3 2-4 4-2l12 12a21 21 0 0 1 19 8l-1 19c-1 14-11 24-25 24-15 0-26-11-26-25 0-9 6-17 18-19Z" fill="#f3b65b"/>
    <path d="m101 18-1-2 1 12c2-4 5-6 9-8l-9-2Zm25 4-1-2v12c-2-4-5-6-9-8l10-2Z" fill="#ee91a1"/>
    <ellipse cx="108" cy="40" rx="2.5" ry="4" fill="#28202a"/>
    <circle cx="107" cy="38.5" r="1" fill="#fff"/>
    <ellipse cx="123" cy="48" rx="8" ry="5.5" fill="#fff0d4"/>
    <path d="m120 45 5 0-2.5 3-2.5-3Z" fill="#dc7689"/>
    <path d="M122.5 48v3m0 0c-2 2-3.5 2-5 1m5-1c2 2 3.5 2 5 1" stroke="#7e5141" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="115" cy="49" rx="3.5" ry="2" fill="#ef8f9f" opacity=".7"/>
  </g>
</svg>
